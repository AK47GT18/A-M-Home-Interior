<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 120 225 165">
  <style>
    :root {
      --icon-color: #000000;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --icon-color: #ffffff;
      }
    }
    .line-stroke {
      stroke: var(--icon-color);
    }
    .shape-fill {
      fill: var(--icon-color);
    }
  </style>

  <!-- Left Wall & Peak -->
  <path
    class="line-stroke"
    d="M 170 275 L 170 160 L 225 125 L 225 275"
    stroke-width="12"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />

  <!-- Right Sloped Roof & Wall -->
  <path
    class="line-stroke"
    d="M 225 125 L 320 205 L 320 275"
    stroke-width="12"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />

  <!-- Ground Line -->
  <line
    class="line-stroke"
    x1="135"
    y1="278"
    x2="355"
    y2="278"
    stroke-width="12"
    stroke-linecap="square"
  />

  <!-- Left 'i' Column -->
  <rect class="shape-fill" x="198" y="160" width="18" height="20" />
  <rect class="shape-fill" x="198" y="190" width="18" height="80" />

  <!-- Pendant Lamp -->
  <line class="line-stroke" x1="252" y1="147" x2="252" y2="180" stroke-width="4.5" stroke-linecap="round" />
  <path class="shape-fill" d="M 241 184 Q 252 173 263 184 Z" />

  <!-- Armchair -->
  <path
    class="shape-fill"
    d="M 248 214 Q 268 214 278 214 C 285 214 290 220 290 228 L 290 238 C 290 242 288 245 285 248 C 285 254 280 258 274 258 L 252 258 C 246 258 241 254 241 248 C 238 245 236 242 236 238 L 236 228 C 236 220 241 214 248 214 Z"
  />
  <line class="line-stroke" x1="248" y1="258" x2="246" y2="269" stroke-width="4" stroke-linecap="round" />
  <line class="line-stroke" x1="278" y1="258" x2="280" y2="269" stroke-width="4" stroke-linecap="round" />
</svg>
