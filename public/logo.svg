<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" fill="none">
  <!-- Exact 1-to-1 Geometry directly from original artwork -->

  <!-- House Left Vertical Wall & Pitch -->
  <path
    d="M 345 558 L 345 320 L 458 250 L 458 558"
    stroke="#000000"
    stroke-width="21"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- House Right Pitch & Right Wall -->
  <path
    d="M 458 250 L 650 415 L 650 558"
    stroke="#000000"
    stroke-width="21"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Heavy Ground Horizontal Baseline -->
  <line
    x1="280"
    y1="562"
    x2="720"
    y2="562"
    stroke="#000000"
    stroke-width="21"
    stroke-linecap="square"
  />

  <!-- Left Compartment 'i' Architectural Cutout / Pillar -->
  <!-- Top Square Dot -->
  <rect
    x="400"
    y="318"
    width="35"
    height="42"
    fill="#000000"
  />
  <!-- Main Pillar Body -->
  <rect
    x="400"
    y="380"
    width="35"
    height="168"
    fill="#000000"
  />

  <!-- Right Room Interior: Ceiling Lamp -->
  <!-- Cable -->
  <line
    x1="512"
    y1="298"
    x2="512"
    y2="362"
    stroke="#000000"
    stroke-width="7"
    stroke-linecap="round"
  />
  <!-- Dome Lampshade -->
  <path
    d="M 494 374 C 494 358 530 358 530 374 Z"
    fill="#000000"
  />

  <!-- Right Room Interior: Modernist Lounge Chair -->
  <!-- Chair Main Body (Curved backrest, arms & cushion) -->
  <path
    d="M 507 433 C 486 433 486 462 486 478 C 486 498 494 506 507 506 L 507 522 C 507 526 513 529 520 529 L 552 529 C 559 529 565 526 565 522 L 565 506 C 578 506 586 498 586 478 C 586 462 586 433 565 433 C 554 433 550 440 536 440 C 522 440 518 433 507 433 Z"
    fill="#000000"
  />
  <!-- Splayed Chair Legs -->
  <line
    x1="510"
    y1="528"
    x2="508"
    y2="542"
    stroke="#000000"
    stroke-width="6"
    stroke-linecap="round"
  />
  <line
    x1="562"
    y1="528"
    x2="564"
    y2="542"
    stroke="#000000"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Exact Full Typography (Pure Solid Black #000000) -->
  <g fill="#000000">
    <text
      x="500"
      y="642"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif"
    >
      <tspan font-size="54" font-weight="900" letter-spacing="0.06em">A &amp; M</tspan>
      <tspan dx="18" font-size="34" font-weight="800" letter-spacing="0.12em">HOME INTERIORS</tspan>
    </text>
  </g>
</svg>
